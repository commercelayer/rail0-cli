# GoReleaser — build cross-platform `rail0` binaries and publish them to a GitHub
# Release. Run by .github/workflows/release.yml when a release pull request merges: the
# workflow creates the tag v$(cat VERSION) on the release commit first, so {{ .Version }}
# below (the tag without its "v") is always the reviewed VERSION.
#
# The CLI is pure Go (no cgo), so every target is a single static binary that
# runs on the user's machine with no toolchain, no libc, nothing to install.
# Validate locally with `goreleaser check` and `goreleaser build --snapshot --clean`.
version: 2

project_name: rail0

before:
  hooks:
    - go mod download
    # Completions and man pages are GENERATED, so they are built here rather than
    # read from the tree: an archive shipping a stale completion script is worse
    # than one shipping none, since nothing would reveal the drift.
    #
    # Written to .release/, NOT dist/: goreleaser requires dist/ to be empty after the
    # before hooks ("ensuring distribution directory"), so completions generated there
    # failed every release before a single binary was built. The man pages need no
    # directory here — gendocs writes them to docs/man, which the archive reads.
    - rm -rf .release
    - mkdir -p .release/completions
    - sh -c 'go run . completion bash > .release/completions/rail0.bash'
    - sh -c 'go run . completion zsh  > .release/completions/_rail0'
    - sh -c 'go run . completion fish > .release/completions/rail0.fish'
    - go run ./tools/gendocs

builds:
  - id: rail0
    main: .
    binary: rail0
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Stamp the version into cmd.version, exactly like bin/build does.
    ldflags:
      - -s -w -X github.com/rail0/cli/cmd.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # No Windows/arm64 target for now.
      - goos: windows
        goarch: arm64

archives:
  - id: rail0
    # e.g. rail0_1.2.0_darwin_arm64.tar.gz  (README* / LICENSE* auto-included)
    name_template: "rail0_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # The archive is self-sufficient: shell completions and man pages travel with the
    # binary instead of living only in the repo, so an install needs no checkout. (#105)
    files:
      - src: .release/completions/*
        dst: completions
      - src: docs/man/*
        dst: man/man1
      - src: docs/cli/*
        dst: docs

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  # Conventional Commits are used across the project; keep noise out of notes.
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew: a cask in commercelayer/homebrew-tap, so `brew install commercelayer/tap/rail0`
# and `brew upgrade` work. A cask, not a formula: GoReleaser deprecated `brews` (it built
# formulas out of prebuilt binaries, which Homebrew no longer wants in formulas).
#
# GoReleaser only WRITES the cask (dist/homebrew/Casks/rail0.rb); it never pushes it. The
# release is still a draft at this point and its download URLs answer 404, so a cask
# pushed now would hand `brew upgrade` a broken URL until the workflow publishes. The
# workflow pushes the file to the tap after publishing (release.yml, "Update the Homebrew
# tap"), with HOMEBREW_TAP_TOKEN; without that secret it skips the tap and the release
# goes ahead.
homebrew_casks:
  - name: rail0
    ids: [rail0]
    repository:
      owner: commercelayer
      name: homebrew-tap
    directory: Casks
    skip_upload: true
    homepage: "https://github.com/commercelayer/rail0-cli"
    description: "Command-line client for the RAIL0 stablecoin payment gateway"
    binaries: [rail0]
    # The short alias `make install` and install.sh create, so every install path names
    # the CLI the same way. A second binary stanza on the same file: Homebrew links it twice.
    custom_block: |
      binary "rail0", target: "r0"
    completions:
      bash: completions/rail0.bash
      zsh: completions/_rail0
      fish: completions/rail0.fish
    manpages:
      - man/man1/rail0.1
    hooks:
      post:
        # The binary is not notarized, so macOS would quarantine it on download and
        # refuse the first run ("cannot be opened because the developer cannot be
        # verified"). Homebrew is the trust decision here; lift the flag it would set.
        # install_steps is Homebrew's declarative DSL (GoReleaser >= 2.19), not Ruby.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/rail0"]
          end

release:
  github:
    owner: commercelayer
    name: rail0-cli
  # Created as a DRAFT and published by the workflow only once every artifact is up:
  # `rail0 update` and install.sh read the latest published release, so a half-uploaded
  # release must never be visible. A resumed run reuses that draft and replaces whatever
  # artifacts the failed run had uploaded.
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
