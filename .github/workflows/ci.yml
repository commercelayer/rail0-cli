# Build, vet and test every push and pull request — plus a check that the committed
# CLI reference is regenerated.
#
# Until now nothing ran on a PR: `release.yml` fires only on a `v*` tag, so a change
# that broke the build or left `docs/` stale was caught either by whoever ran the
# commands locally, or at release time. The docs half was not hypothetical — `rail0
# tokens` had gained a whole Long description and an `--active` flag that never reached
# docs/cli or docs/man. (#68)
#
# rail0-cli depends on rail0-go through `replace github.com/commercelayer/rail0-go =>
# ../rail0-go` (go.mod). rail0-go is PRIVATE and the default GITHUB_TOKEN only grants
# access to this repo, so the sibling checkout needs the same dedicated token the
# release workflow uses:
#
#   Secret RAIL0_GO_TOKEN — a fine-grained PAT (or deploy key) with `contents: read`
#   on commercelayer/rail0-go.
#
# Consequence worth knowing: a pull request from a FORK gets no secrets, so the
# rail0-go checkout — and therefore this whole job — cannot run there. That is
# acceptable while contributions come from branches in this repo; if forks ever matter,
# the SDK has to be consumable without a private checkout.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rail0-cli
        uses: actions/checkout@v4
        with:
          path: rail0-cli

      # Which rail0-go to build against: the branch of the SAME NAME when it exists,
      # otherwise main.
      #
      # `ref: main` alone made every coordinated change unbuildable. The SDK is consumed
      # through `replace … => ../rail0-go`, so a CLI change that follows an SDK change
      # cannot compile until the SDK has landed on main — and the CLI PR that carries the
      # matching work fails for a reason that has nothing to do with it. Since branch
      # names are shared across these repos by convention (feature/webhook-topics in
      # both), looking for the twin first makes the pair testable before either merges,
      # and falls back to main for every ordinary PR.
      - name: Pick the rail0-go ref
        id: sdk_ref
        env:
          GH_TOKEN: ${{ secrets.RAIL0_GO_TOKEN }}
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if gh api "repos/commercelayer/rail0-go/branches/$branch" >/dev/null 2>&1; then
            echo "Building against rail0-go@$branch (twin branch found)"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Building against rail0-go@main (no branch named $branch there)"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout rail0-go (private sibling; resolves ../rail0-go)
        uses: actions/checkout@v4
        with:
          repository: commercelayer/rail0-go
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: rail0-go
          token: ${{ secrets.RAIL0_GO_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: rail0-cli/go.sum

      # Reported as a diff rather than a bare exit code: "gofmt failed" tells you
      # nothing, the diff tells you exactly what to run gofmt on.
      - name: gofmt
        working-directory: rail0-cli
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt needed on:"; gofmt -l .
            gofmt -d .
            exit 1
          fi

      - name: Build
        working-directory: rail0-cli
        run: go build ./...

      - name: Vet
        working-directory: rail0-cli
        run: go vet ./...

      - name: Test
        working-directory: rail0-cli
        run: go test ./...

      # The reference docs are GENERATED from the command tree, so a changed flag or
      # help string silently invalidates them. Regenerate and fail on any diff, which
      # makes staleness impossible to merge rather than something to notice.
      - name: Reference docs are up to date
        working-directory: rail0-cli
        run: |
          go run ./tools/gendocs
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale — run 'bin/docs' (or 'go run ./tools/gendocs') and commit the result"
            git diff --stat -- docs/
            git diff -- docs/
            exit 1
          fi

      # …and the generated docs must not depend on WHEN they are generated. The man
      # header's date used to come from time.Now() (Cobra's default for a nil Date),
      # so the committed pages went stale by themselves at every month boundary: the
      # first pull request of a new month went red with 60 files changed, not one
      # line of code touched, and the "fix" was to commit the new month. Cobra reads
      # SOURCE_DATE_EPOCH only when the header carries no date, so shifting it here
      # reproduces that regression NOW instead of next month.
      - name: Reference docs do not depend on the clock
        working-directory: rail0-cli
        run: |
          SOURCE_DATE_EPOCH=1893456000 go run ./tools/gendocs   # 2030-01-01
          if ! git diff --quiet -- docs/; then
            echo "::error::docs generation depends on the clock — pin the man header Date in tools/gendocs (see docsDate)"
            git diff --stat -- docs/
            exit 1
          fi
