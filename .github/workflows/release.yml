# Release the rail0 CLI when an approved release pull request merges.
#
# Releasing is three steps:
#   1. bin/release-prepare opens "chore(release): vX.Y.Z", which bumps VERSION (and, if
#      asked, the rail0-go version go.mod requires) and carries the release notes;
#      Run on a feature branch instead, it bumps the version there and writes the notes
#      into that branch's open pull request: one approval for the change and its release;
#   2. a reviewer approves it and it is merged;
#   3. this workflow, on that push to main: plan → gate (ci.yml on the release commit,
#      against the go.mod rail0-go tag) → tag vX.Y.Z → GoReleaser (binaries + a draft
#      release) → publish the release → Homebrew tap → Slack.
#
# Why on merge, not on a pushed tag: a tag pushed from a laptop was the release, with no
# review and no CI on that commit. Now the reviewed pull request IS the release, and the
# tag is created only here, equal to VERSION. A push that does not change VERSION is a
# no-op (plan stops). "Run workflow" (workflow_dispatch, main only) resumes a run that
# stopped halfway: the tag is reused, GoReleaser reuses its draft and replaces the
# artifacts, and the release is published once complete.
#
# The release commit is the one that SET the version (the release PR's merge), found from
# history, not the head of main: a resume after other merges still ships exactly the
# reviewed commit.
#
# Homebrew: GoReleaser writes the cask, and the publish job pushes it to
# commercelayer/homebrew-tap after the release is published, with the optional secret
# HOMEBREW_TAP_TOKEN (see "Update the Homebrew tap").
#
# rail0-go comes from the Go module proxy at the version go.mod requires. The plan
# refuses a pseudo-version or a version with no rail0-go tag, so a release always builds
# against a released SDK.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch: # resume a release that stopped halfway; refused off main

permissions:
  contents: read

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::releases run from main only (got ${GITHUB_REF})"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history (the commit that set the version) and tags

      - name: What to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_at() { git show "$1:VERSION" 2>/dev/null | tr -d ' \t\r\n' || true; }

          version="$(version_at HEAD)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION '$version' is not X.Y.Z"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

          tagged=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tagged=true
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$tagged" = true ] && [ "$draft" = false ]; then
            echo "::notice::$tag is tagged and released: nothing to release"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # The commit that set this version: the newest first-parent commit of main whose
          # VERSION differs from its parent's.
          commit=""
          for c in $(git log --first-parent --format=%H -- VERSION); do
            if [ "$(version_at "$c")" = "$version" ] && [ "$(version_at "$c^1")" != "$version" ]; then
              commit="$c"
              break
            fi
          done
          if [ -z "$commit" ]; then
            echo "::error::cannot find the commit that set VERSION $version"
            exit 1
          fi

          if [ "$tagged" = true ]; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tag_commit" != "$commit" ]; then
              echo "::error::tag $tag is on $tag_commit, but VERSION $version was set by $commit"
              exit 1
            fi
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "::error::$version is older than the latest tag $latest"
              exit 1
            fi
          fi

          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          {
            echo "### Releasing rail0 CLI $version"
            echo "- commit: \`$commit\`"
            echo "- tagged already: $tagged"
            echo "- GitHub release: $( [ "$draft" = missing ] && echo none || echo draft )"
          } >>"$GITHUB_STEP_SUMMARY"

      # The version go.mod requires AT THE RELEASE COMMIT, in either form (inside the
      # require block, or a one-line `require github.com/commercelayer/rail0-go vX.Y.Z`).
      - name: Check go.mod requires a released rail0-go
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          version="$(git show "$COMMIT:go.mod" | awk '
            $1 == "github.com/commercelayer/rail0-go" && $2 ~ /^v/ { print $2; exit }
            $1 == "require" && $2 == "github.com/commercelayer/rail0-go" { print $3; exit }
          ')"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::go.mod must require a released rail0-go vX.Y.Z, got '${version}'"
            exit 1
          fi
          if ! gh api "repos/commercelayer/rail0-go/git/ref/tags/${version}" >/dev/null 2>&1; then
            echo "::error::rail0-go has no tag ${version} (required by go.mod) — release the SDK first, or fix the require line"
            exit 1
          fi
          echo "Building against rail0-go@${version} (from go.mod)"

  # No release without a second person. The commit that set the version must have reached
  # main through a merged pull request that a reviewer OTHER THAN ITS AUTHOR approved, on
  # the pull request's final commit (an approval followed by a new push, a dismissal or a
  # change request does not count). Branch protection already asks for a review, but an
  # admin can bypass it, a bare push to main has no review at all, and a "Run workflow"
  # resume runs long after the merge: this job is the check that cannot be skipped, on the
  # exact commit about to ship. Bots never count as the reviewer.
  approval:
    name: Approved by a third-party reviewer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Release pull request approved by someone other than its author
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .number | tostring] | join(" ")')"
          if [ -z "$prs" ]; then
            echo "::error::$COMMIT did not reach main through a merged pull request: a release needs an approved release PR"
            exit 1
          fi
          for pr in $prs; do
            author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .user.login)"
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
            # Reviews come oldest first: the last non-comment state per reviewer is theirs.
            approvers="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
              --jq '.[] | [.user.login, .state, .commit_id] | @tsv' |
              awk -F'\t' -v author="$author" -v head="$head" '
                $1 ~ /\[bot\]$/ || $2 == "COMMENTED" || $2 == "PENDING" { next }
                { last[$1] = $2; at[$1] = $3 }
                END { for (u in last) if (u != author && last[u] == "APPROVED" && at[u] == head) print u }')"
            if [ -n "$approvers" ]; then
              approvers="$(echo $approvers)"
              echo "::notice::#$pr by $author, approved by $approvers"
              echo "- approved: #$pr (author $author) by $approvers" >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::the release PR (#${prs// /, #}) has no approval from a reviewer other than its author on its final commit: nothing is published"
          exit 1

  gate:
    name: CI on the release commit
    needs: [plan, approval]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  publish:
    name: Tag, build, release
    needs: [plan, approval, gate]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
    permissions:
      contents: write # the tag, the GitHub release and its assets
      pull-requests: read # the release notes, from the release PR's body
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - name: Checkout rail0-cli at the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0 # full history + tags for GoReleaser's previous-tag lookup

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Latest 1.26.x patch, not whatever the runner has cached: the stdlib ships
          # inside the binary, so a stale patch release ships its CVEs too.
          check-latest: true
          cache-dependency-path: go.sum

      - name: Release notes from the release pull request
        id: notes
        run: |
          set -euo pipefail
          # The pull request the release commit came in with — a release-only one
          # ("chore(release): vX.Y.Z", opened on main) or a feature one whose branch
          # carried the bump (bin/release-prepare on a branch): the notes are between the
          # same markers in either.
          number="$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' || true)"
          if [ -z "$number" ]; then
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --search "\"chore(release): $TAG\" in:title" \
              --json number,title --jq '[.[] | select(.title | contains(env.TAG))][0].number // empty' || true)"
          fi
          if [ -z "$number" ]; then
            echo "::notice::no merged release pull request for $TAG found: GoReleaser writes the changelog"
            exit 0
          fi
          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$RUNNER_TEMP/pr-body.md"
          awk '/<!-- release-notes:end -->/ { inside = 0 } inside { print } /<!-- release-notes:start -->/ { inside = 1 }' \
            "$RUNNER_TEMP/pr-body.md" >"$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || cp "$RUNNER_TEMP/pr-body.md" "$RUNNER_TEMP/notes.md"
          printf '\nRelease pull request: #%s\n' "$number" >>"$RUNNER_TEMP/notes.md"
          echo "file=$RUNNER_TEMP/notes.md" >>"$GITHUB_OUTPUT"

      # The tag comes first: GoReleaser builds from the tag at HEAD and takes the
      # version from it, so the binaries' `rail0 version` is VERSION by construction.
      - name: Tag the release commit
        run: |
          set -euo pipefail
          [ "$(tr -d ' \t\r\n' <VERSION)" = "$VERSION" ] || { echo "::error::VERSION does not say $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists (a resumed run)"
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git tag "$TAG" "$COMMIT"
            git push origin "refs/tags/$TAG"
          fi
          [ "$(git rev-list -n 1 "$TAG")" = "$COMMIT" ] || { echo "::error::$TAG is not on $COMMIT"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.file && format('--release-notes={0}', steps.notes.outputs.file) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser leaves a draft (see .goreleaser.yaml): publish it only now, with every
      # binary and checksums.txt in place, so `rail0 update` never sees half a release.
      - name: Publish the GitHub release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      # The cask GoReleaser wrote (dist/homebrew/Casks/rail0.rb), pushed only now that the
      # release is published and its download URLs answer: `brew upgrade` never sees a
      # cask pointing at a draft. Optional: without HOMEBREW_TAP_TOKEN (a fine-grained PAT
      # with `contents: read and write` on commercelayer/homebrew-tap) the release stands
      # and the tap keeps its previous version. Re-running is harmless: an unchanged cask
      # commits nothing.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: commercelayer/homebrew-tap was not updated to $TAG"
            exit 0
          fi
          cask=dist/homebrew/Casks/rail0.rb
          [ -f "$cask" ] || { echo "::error::GoReleaser wrote no $cask"; exit 1; }
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --quiet --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/commercelayer/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          cp "$cask" "$tap/Casks/rail0.rb"
          cd "$tap"
          git add Casks/rail0.rb
          if git diff --cached --quiet; then
            echo "The tap already has rail0 $VERSION"
            exit 0
          fi
          git -c user.name=rail0-release-bot -c user.email=noreply@github.com commit --quiet -m "rail0 $VERSION"
          git push --quiet origin HEAD
          echo "- Homebrew: commercelayer/homebrew-tap updated to rail0 $VERSION" >>"$GITHUB_STEP_SUMMARY"

  announce:
    name: Slack message
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      # The channel: swap the secret here (one place) to post somewhere else.
      SLACK_WEBHOOK_URL: ${{ secrets.PIPELINE_SLACK_CHANNEL_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: No Slack webhook
        if: env.SLACK_WEBHOOK_URL == ''
        run: echo "::warning::the Slack webhook secret is not available to this repository; no message posted"

      - name: Post to a Slack channel
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook-type: incoming-webhook
          payload: |
            {
            "text": "New release for rail0 CLI (${{ needs.plan.outputs.tag }})",
            "blocks": [
              {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": ":keyboard: New release for <${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}|rail0 CLI>\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}|release notes>"
              }
              },
              {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*Project:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.event.repository.name }}>" },
                { "type": "mrkdwn", "text": "*Version:*\n${{ needs.plan.outputs.tag }}" }
              ]
              },
              {
              "type": "context",
              "elements": [
                { "type": "image", "image_url": "${{ github.event.sender.avatar_url }}", "alt_text": "${{ github.event.sender.login }}" },
                { "type": "mrkdwn", "text": "triggered by *${{ github.event.sender.login }}*" }
              ]
              }
            ]
            }
