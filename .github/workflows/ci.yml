# Build, vet and test every push and pull request — plus a check that the committed
# CLI reference is regenerated.
#
# Until now nothing ran on a PR: `release.yml` fires only on a `v*` tag, so a change
# that broke the build or left `docs/` stale was caught either by whoever ran the
# commands locally, or at release time. The docs half was not hypothetical — `rail0
# tokens` had gained a whole Long description and an `--active` flag that never reached
# docs/cli or docs/man. (#68)
#
# rail0-go comes from the Go module proxy at the version go.mod requires, like every
# other dependency: no sibling checkout, no token, so pull requests from forks run too.
# A CLI change that needs unreleased SDK code requires a pseudo-version of the SDK branch
# (`go get github.com/commercelayer/rail0-go@<branch>`); CI builds it, and the release
# refuses it until go.mod requires a tagged vX.Y.Z.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this as its gate, on the exact commit it is about to release.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check (default: the commit of the triggering event)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rail0-cli
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }} # empty outside workflow_call: the event's own commit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Latest 1.26.x patch, not whatever the runner has cached: the stdlib ships
          # inside the binary, so a stale patch release ships its CVEs too (1.26.8 on
          # the runner missed nine net/http and crypto/tls fixes in 1.26.9).
          check-latest: true
          cache-dependency-path: go.sum

      # Reported as a diff rather than a bare exit code: "gofmt failed" tells you
      # nothing, the diff tells you exactly what to run gofmt on.
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt needed on:"; gofmt -l .
            gofmt -d .
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The reference docs are GENERATED from the command tree, so a changed flag or
      # help string silently invalidates them. Regenerate and fail on any diff, which
      # makes staleness impossible to merge rather than something to notice.
      - name: Reference docs are up to date
        run: |
          go run ./tools/gendocs
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale — run 'bin/docs' (or 'go run ./tools/gendocs') and commit the result"
            git diff --stat -- docs/
            git diff -- docs/
            exit 1
          fi

      # …and the generated docs must not depend on WHEN they are generated. The man
      # header's date used to come from time.Now() (Cobra's default for a nil Date),
      # so the committed pages went stale by themselves at every month boundary: the
      # first pull request of a new month went red with 60 files changed, not one
      # line of code touched, and the "fix" was to commit the new month. Cobra reads
      # SOURCE_DATE_EPOCH only when the header carries no date, so shifting it here
      # reproduces that regression NOW instead of next month.
      - name: Reference docs do not depend on the clock
        run: |
          SOURCE_DATE_EPOCH=1893456000 go run ./tools/gendocs   # 2030-01-01
          if ! git diff --quiet -- docs/; then
            echo "::error::docs generation depends on the clock — pin the man header Date in tools/gendocs (see docsDate)"
            git diff --stat -- docs/
            exit 1
          fi

      # install.sh is served straight from main to `curl … | sh`, so a syntax error there
      # breaks every new install at once and nothing else would notice. `sh -n` parses it
      # without running it; `sh` here is dash on the runner, the strictest POSIX shell a
      # user is likely to pipe it into.
      - name: install.sh parses as POSIX sh
        run: sh -n install.sh

      # VERSION is the release version: the release workflow tags v$(cat VERSION) and
      # GoReleaser stamps the binaries from that tag. Anything but X.Y.Z would make a tag
      # GoReleaser and `rail0 update` cannot order.
      - name: VERSION is X.Y.Z
        run: grep -Eqx '(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)' VERSION

      # bin/release-prepare opens every release pull request; its test drives it against
      # a throwaway repository (no network, no GitHub), refusals and one full run included.
      - name: bin/release-prepare
        run: bin/release-prepare-test
