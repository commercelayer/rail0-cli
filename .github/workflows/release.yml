# Build and publish cross-platform `rail0` binaries to a GitHub Release on every
# `v*` tag (via GoReleaser — see .goreleaser.yaml).
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# rail0-cli depends on rail0-go through `replace github.com/commercelayer/rail0-go =>
# ../rail0-go` (go.mod). rail0-go is PRIVATE, and the default GITHUB_TOKEN only
# grants access to this repo, so the sibling checkout needs a dedicated token:
#
#   Secret RAIL0_GO_TOKEN — a fine-grained PAT (or deploy key) with
#   `contents: read` on commercelayer/rail0-go. Add it under
#   Settings → Secrets and variables → Actions in commercelayer/rail0-cli.
#
# Both repos are checked out as siblings under the workspace so `../rail0-go`
# resolves; GoReleaser runs inside the rail0-cli checkout.
#
# Which rail0-go a release is built against: EXACTLY the version go.mod requires
# (`github.com/commercelayer/rail0-go vX.Y.Z`), checked out at that tag. It used to be
# `ref: main`, so a CLI release built against whatever the SDK's main held at tag time
# — unreleased, possibly breaking SDK code shipped inside a CLI binary whose go.mod
# claimed a different version, and two builds of the same CLI tag could differ. The
# release now fails if the require line is not a plain vX.Y.Z or that tag does not
# exist in rail0-go: bump go.mod to a RELEASED SDK version before tagging the CLI.
# (ci.yml deliberately keeps building against rail0-go main / a twin branch, to catch
# SDK breakage early; see the comment there.)
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rail0-cli
        uses: actions/checkout@v4
        with:
          path: rail0-cli
          fetch-depth: 0 # full history + tags for `git describe` / changelog

      # The version go.mod requires, in either form (inside the require block, or a
      # one-line `require github.com/commercelayer/rail0-go vX.Y.Z`). The `replace`
      # line never matches: its second field is `=>`.
      - name: Resolve the rail0-go version from go.mod
        id: sdk_ref
        working-directory: rail0-cli
        env:
          GH_TOKEN: ${{ secrets.RAIL0_GO_TOKEN }}
        run: |
          version="$(awk '
            $1 == "github.com/commercelayer/rail0-go" && $2 ~ /^v/ { print $2; exit }
            $1 == "require" && $2 == "github.com/commercelayer/rail0-go" { print $3; exit }
          ' go.mod)"
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::go.mod must require a released rail0-go vX.Y.Z, got '${version}'"
            exit 1
          fi
          if ! gh api "repos/commercelayer/rail0-go/git/ref/tags/${version}" >/dev/null 2>&1; then
            echo "::error::rail0-go has no tag ${version} (required by go.mod) — release the SDK first, or fix the require line"
            exit 1
          fi
          echo "Building against rail0-go@${version} (from go.mod)"
          echo "ref=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout rail0-go at the go.mod version (private sibling; resolves ../rail0-go)
        uses: actions/checkout@v4
        with:
          repository: commercelayer/rail0-go
          ref: refs/tags/${{ steps.sdk_ref.outputs.ref }}
          path: rail0-go
          token: ${{ secrets.RAIL0_GO_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # Latest 1.26.x patch, not whatever the runner has cached: the stdlib ships
          # inside the binary, so a stale patch release ships its CVEs too (1.26.8 on
          # the runner missed nine net/http and crypto/tls fixes in 1.26.9).
          check-latest: true
          cache-dependency-path: rail0-cli/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: rail0-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
